<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Laporan barang hilang dan temuan kampus, berbasis Delcom Open API." />
    <title>Delcom Lost &amp; Found</title>

    <!-- Buka koneksi ke server Delcom lebih awal (untuk foto profil & cover) -->
    <link rel="preconnect" href="https://open-api.delcom.org" />

    <!-- Google Fonts: Bricolage Grotesque (judul) + Plus Jakarta Sans (teks).
         Dimuat tanpa memblokir render: media="print" lalu diganti "all" setelah selesai. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  <body class="bg-stone-100 text-slate-800 antialiased min-h-screen">
    <!-- Isi sementara sebelum React tampil: tetap punya <main> dan <h1>, lalu diganti React -->
    <div id="root">
      <main class="min-h-screen flex items-center justify-center">
        <h1 class="sr-only">Delcom Lost &amp; Found</h1>
        <p class="text-sm font-medium text-slate-600" role="status">Memuat aplikasi...</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
